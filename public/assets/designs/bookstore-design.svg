<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#2a164d" />
      <stop offset="100%" stop-color="#110822" />
    </linearGradient>
    <linearGradient id="bsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="bsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#bsBg)" />
  <circle cx="700" cy="90" r="130" fill="#ec4899" opacity="0.14" filter="blur(50px)" />
  <circle cx="120" cy="400" r="130" fill="#8b5cf6" opacity="0.14" filter="blur(50px)" />

  <g transform="translate(40, 35)" filter="url(#bsShadow)">
    <rect width="720" height="430" rx="16" fill="#180e2b" stroke="#3b2361" stroke-width="1.5" />
    <rect width="720" height="44" rx="16" fill="#24153f" />
    <path d="M 0,44 L 720,44" stroke="#3b2361" stroke-width="1" />
    <circle cx="25" cy="22" r="5" fill="#ef4444" />
    <circle cx="43" cy="22" r="5" fill="#eab308" />
    <circle cx="61" cy="22" r="5" fill="#22c55e" />
    <rect x="180" y="10" width="360" height="24" rx="6" fill="#120921" stroke="#3b2361" />
    <text x="360" y="26" fill="#d8b4fe" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">biomela.store/categories/biomedical-textbooks</text>

    <!-- Top nav inside app -->
    <g transform="translate(40, 65)">
      <text x="0" y="18" fill="#f5d0fe" font-family="Inter, sans-serif" font-size="18" font-weight="700">Biomela Books</text>
      <text x="140" y="17" fill="#a855f7" font-family="Inter, sans-serif" font-size="11">Catalog</text>
      <text x="200" y="17" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Top Rated</text>
      <text x="270" y="17" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Medical Journals</text>

      <rect x="420" y="0" width="160" height="26" rx="6" fill="#281647" stroke="#4c2882" />
      <text x="440" y="17" fill="#c084fc" font-family="Inter, sans-serif" font-size="10">Search biomedical books...</text>
      <rect x="590" y="0" width="50" height="26" rx="6" fill="url(#bsAccent)" />
      <text x="615" y="17" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Cart (3)</text>

      <!-- Banner -->
      <g transform="translate(0, 45)">
        <rect width="640" height="85" rx="12" fill="url(#bsAccent)" opacity="0.25" stroke="#a855f7" stroke-width="1" />
        <text x="25" y="35" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="700">Biomedical &amp; Clinical Anatomy 2026 Editions</text>
        <text x="25" y="55" fill="#e9d5ff" font-family="Inter, sans-serif" font-size="11">Discover peer-reviewed reference textbooks with instant digital access.</text>
        <rect x="25" y="62" width="90" height="16" rx="4" fill="#ffffff" />
        <text x="70" y="74" fill="#6b21a8" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Shop Collection</text>
      </g>

      <!-- Book cards -->
      <g transform="translate(0, 150)">
        <!-- Card 1 -->
        <rect width="145" height="180" rx="10" fill="#22133d" stroke="#3b2361" />
        <rect x="15" y="15" width="115" height="95" rx="6" fill="#3b2066" />
        <text x="72" y="65" fill="#c084fc" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Human Anatomy</text>
        <text x="15" y="128" fill="#fdf4ff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Gray's Anatomy</text>
        <text x="15" y="144" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">$120.00</text>
        <rect x="15" y="152" width="115" height="18" rx="4" fill="#8b5cf6" />
        <text x="72" y="165" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Add to Cart</text>

        <!-- Card 2 -->
        <g transform="translate(165, 0)">
          <rect width="145" height="180" rx="10" fill="#22133d" stroke="#3b2361" />
          <rect x="15" y="15" width="115" height="95" rx="6" fill="#4a1d6d" />
          <text x="72" y="65" fill="#f472b6" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Biochemistry</text>
          <text x="15" y="128" fill="#fdf4ff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Lehninger Principles</text>
          <text x="15" y="144" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">$95.50</text>
          <rect x="15" y="152" width="115" height="18" rx="4" fill="#8b5cf6" />
          <text x="72" y="165" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Add to Cart</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(330, 0)">
          <rect width="145" height="180" rx="10" fill="#22133d" stroke="#3b2361" />
          <rect x="15" y="15" width="115" height="95" rx="6" fill="#283a66" />
          <text x="72" y="65" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Pathology</text>
          <text x="15" y="128" fill="#fdf4ff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Robbins Pathology</text>
          <text x="15" y="144" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">$110.00</text>
          <rect x="15" y="152" width="115" height="18" rx="4" fill="#8b5cf6" />
          <text x="72" y="165" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Add to Cart</text>
        </g>

        <!-- Card 4 -->
        <g transform="translate(495, 0)">
          <rect width="145" height="180" rx="10" fill="#22133d" stroke="#3b2361" />
          <rect x="15" y="15" width="115" height="95" rx="6" fill="#1c474d" />
          <text x="72" y="65" fill="#34d399" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Physiology</text>
          <text x="15" y="128" fill="#fdf4ff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Guyton &amp; Hall</text>
          <text x="15" y="144" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">$105.00</text>
          <rect x="15" y="152" width="115" height="18" rx="4" fill="#8b5cf6" />
          <text x="72" y="165" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Add to Cart</text>
        </g>
      </g>
    </g>
  </g>
</svg>