          <circle cx="30" cy="30" r="12" fill="#7c3aed" />
          <text x="50" y="34" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="700">Generative AI</text>
          <text x="15" y="62" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Custom LLM deployment and predictive pipeline orchestration.</text>
          <text x="15" y="98" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="600">Learn More →</text>
        </g>

