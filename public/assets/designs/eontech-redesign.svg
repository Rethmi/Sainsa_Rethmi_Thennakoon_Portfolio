          <circle cx="65" cy="50" r="30" fill="url(#eonGrad)" opacity="0.4" />
          <text x="65" y="45" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">99.99%</text>
          <text x="65" y="60" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Uptime SLA</text>
        </g>
      </g>

      <!-- 3 Feature Pillars -->
      <g transform="translate(0, 215)">
        <rect width="200" height="115" rx="10" fill="#141738" stroke="#252759" />
        <circle cx="30" cy="30" r="12" fill="#4f46e5" />
        <text x="50" y="34" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="700">Cloud Migration</text>
        <text x="15" y="62" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Zero-downtime microservice transitions with multi-region redundancy.</text>
        <text x="15" y="98" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="600">Learn More →</text>

