<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1f" />
      <stop offset="50%" stop-color="#121138" />
      <stop offset="100%" stop-color="#050512" />
    </linearGradient>
    <linearGradient id="eonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="eonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#eonBg)" />
  <circle cx="680" cy="80" r="150" fill="#7c3aed" opacity="0.18" filter="blur(55px)" />
  <circle cx="120" cy="420" r="140" fill="#06b6d4" opacity="0.15" filter="blur(55px)" />

  <g transform="translate(40, 35)" filter="url(#eonShadow)">
    <rect width="720" height="430" rx="16" fill="#0d0e24" stroke="#252759" stroke-width="1.5" />
    <rect width="720" height="44" rx="16" fill="#141638" />
    <path d="M 0,44 L 720,44" stroke="#252759" stroke-width="1" />
    <circle cx="25" cy="22" r="5" fill="#ef4444" />
    <circle cx="43" cy="22" r="5" fill="#eab308" />
    <circle cx="61" cy="22" r="5" fill="#22c55e" />
    <rect x="180" y="10" width="360" height="24" rx="6" fill="#090a18" stroke="#252759" />
    <text x="360" y="26" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">eontechglobal.com/redesign-2026</text>

    <!-- App navigation bar -->
    <g transform="translate(40, 65)">
      <text x="0" y="20" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="800" letter-spacing="1">EONTECH</text>
      <text x="140" y="18" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="11" font-weight="600">Solutions</text>
      <text x="215" y="18" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Enterprise</text>
      <text x="295" y="18" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Case Studies</text>
      <text x="390" y="18" fill="#64748b" font-family="Inter, sans-serif" font-size="11">About Us</text>
      <rect x="530" y="2" width="110" height="26" rx="8" fill="url(#eonGrad)" />
      <text x="585" y="19" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Get in Touch →</text>

      <!-- Hero Section of Website Redesign -->
      <g transform="translate(0, 50)">
        <rect width="640" height="150" rx="14" fill="#141738" stroke="#2c2f6d" stroke-width="1" />
        <rect x="25" y="20" width="110" height="18" rx="9" fill="#4f46e5" opacity="0.3" />
        <text x="80" y="33" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ENTERPRISE CLOUD &amp; AI</text>
        <text x="25" y="65" fill="#ffffff" font-family="Inter, sans-serif" font-size="22" font-weight="800">Architecting Tomorrow's</text>
        <text x="25" y="92" fill="#38bdf8" font-family="Inter, sans-serif" font-size="22" font-weight="800">Digital Ecosystems</text>
        <text x="25" y="115" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Global cloud transformation, AI integrations, and resilient enterprise software architecture.</text>
        <rect x="25" y="125" width="105" height="18" rx="5" fill="url(#eonGrad)" />
        <text x="77" y="137" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Explore Platform</text>
        
        <!-- Right side graphic / 3D block representation -->
        <g transform="translate(480, 25)">
