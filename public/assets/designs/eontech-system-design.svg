<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#190d33" />
      <stop offset="100%" stop-color="#020008" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="sysDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#sysBg)" />
  <circle cx="120" cy="120" r="140" fill="#a855f7" opacity="0.12" filter="blur(50px)" />
  <circle cx="680" cy="380" r="160" fill="#6366f1" opacity="0.12" filter="blur(50px)" />

  <g transform="translate(40, 35)" filter="url(#sysDrop)">
    <rect width="720" height="430" rx="16" fill="#120c24" stroke="#2e1d52" stroke-width="1.5" />
    <rect width="720" height="44" rx="16" fill="#1d1438" />
    <path d="M 0,44 L 720,44" stroke="#2e1d52" stroke-width="1" />
    
    <circle cx="25" cy="22" r="5.5" fill="#ef4444" />
    <circle cx="45" cy="22" r="5.5" fill="#eab308" />
    <circle cx="65" cy="22" r="5.5" fill="#22c55e" />

    <rect x="180" y="10" width="360" height="24" rx="6" fill="#120c24" stroke="#2e1d52" />
    <text x="360" y="26" fill="#c084fc" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">eontech.design/system/v2.4/components</text>

    <!-- Header -->
    <rect x="25" y="65" width="28" height="28" rx="8" fill="url(#purpleGlow)" />
    <text x="64" y="84" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="bold">EonTech Design System</text>
    <rect x="260" y="70" width="75" height="20" rx="10" fill="#a855f7" opacity="0.2" />
    <text x="297" y="84" fill="#d8b4fe" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">v2.4 PROD</text>

    <!-- Color Tokens Column -->
    <g transform="translate(25, 110)">
      <rect width="180" height="295" rx="14" fill="#1d1438" stroke="#2e1d52" />
      <text x="18" y="26" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Semantic Color Tokens</text>
      
      <circle cx="32" cy="56" r="14" fill="#6366f1" />
      <text x="56" y="54" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Brand Primary</text>
      <text x="56" y="68" fill="#94a3b8" font-family="monospace" font-size="9">#6366F1</text>

      <circle cx="32" cy="100" r="14" fill="#a855f7" />
      <text x="56" y="98" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Accent Violet</text>
      <text x="56" y="112" fill="#94a3b8" font-family="monospace" font-size="9">#A855F7</text>

      <circle cx="32" cy="144" r="14" fill="#10b981" />
      <text x="56" y="142" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Success Mint</text>
      <text x="56" y="156" fill="#94a3b8" font-family="monospace" font-size="9">#10B981</text>

      <circle cx="32" cy="188" r="14" fill="#f59e0b" />
      <text x="56" y="186" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Warning Amber</text>
      <text x="56" y="200" fill="#94a3b8" font-family="monospace" font-size="9">#F59E0B</text>

      <circle cx="32" cy="232" r="14" fill="#ef4444" />
      <text x="56" y="230" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Destructive</text>
      <text x="56" y="244" fill="#94a3b8" font-family="monospace" font-size="9">#EF4444</text>

      <rect x="18" y="260" width="144" height="22" rx="6" fill="#2e1d52" />
      <text x="90" y="275" fill="#c084fc" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">54 Tokens Exported</text>
    </g>

    <!-- Component Buttons & Inputs Panel -->
    <g transform="translate(220, 110)">
      <rect width="250" height="295" rx="14" fill="#1d1438" stroke="#2e1d52" />
      <text x="20" y="26" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Interactive Component States</text>
      
      <!-- Primary Button -->
      <rect x="20" y="45" width="100" height="34" rx="8" fill="url(#purpleGlow)" />
      <text x="70" y="66" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Primary</text>

      <rect x="130" y="45" width="100" height="34" rx="8" fill="#120c24" stroke="#a855f7" />
      <text x="180" y="66" fill="#c084fc" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Secondary</text>

      <!-- Badge states -->
      <rect x="20" y="95" width="60" height="22" rx="11" fill="#10b981" opacity="0.15" />
      <text x="50" y="109" fill="#34d399" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Active</text>

      <rect x="88" y="95" width="65" height="22" rx="11" fill="#f59e0b" opacity="0.15" />
      <text x="120" y="109" fill="#fbbf24" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Pending</text>

      <rect x="160" y="95" width="68" height="22" rx="11" fill="#ef4444" opacity="0.15" />
      <text x="194" y="109" fill="#f87171" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Disabled</text>

      <!-- Text Input Mockup -->
      <text x="20" y="145" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600">INPUT FIELD (FOCUS STATE)</text>
      <rect x="20" y="155" width="210" height="38" rx="8" fill="#120c24" stroke="#a855f7" stroke-width="1.5" />
      <text x="32" y="178" fill="#ffffff" font-family="Inter, sans-serif" font-size="11">user@eontechglobal.com</text>
      <rect x="180" y="166" width="38" height="16" rx="8" fill="#2e1d52" />
      <text x="199" y="177" fill="#c084fc" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Valid</text>

      <!-- Switch Toggle -->
      <text x="20" y="222" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600">DARK THEME SWITCH</text>
      <rect x="20" y="235" width="48" height="26" rx="13" fill="#a855f7" />
      <circle cx="37" cy="248" r="10" fill="#ffffff" />
      <text x="80" y="252" fill="#ffffff" font-family="Inter, sans-serif" font-size="11">Enabled</text>
    </g>

    <!-- Typography & Elevation -->
    <g transform="translate(485, 110)">
      <rect width="210" height="295" rx="14" fill="#1d1438" stroke="#2e1d52" />
      <text x="20" y="26" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Typography &amp; Grid Scale</text>

      <text x="20" y="58" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="bold">Display H1</text>
      <text x="20" y="74" fill="#94a3b8" font-family="monospace" font-size="9">32px / Bold / Tight</text>

      <text x="20" y="106" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="600">Heading H2</text>
      <text x="20" y="120" fill="#94a3b8" font-family="monospace" font-size="9">24px / Semibold</text>

      <text x="20" y="150" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12">Body Paragraph Regular</text>
      <text x="20" y="164" fill="#94a3b8" font-family="monospace" font-size="9">14px / Line-height 150%</text>

      <!-- Elevation Box -->
      <text x="20" y="200" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600">ELEVATION TOKENS</text>
      <rect x="20" y="212" width="80" height="60" rx="8" fill="#120c24" stroke="#2e1d52" />
      <text x="60" y="247" fill="#c084fc" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Level 2</text>
      
      <rect x="110" y="212" width="80" height="60" rx="8" fill="#120c24" stroke="#a855f7" stroke-width="1.5" />
      <text x="150" y="247" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Level 4 Hover</text>
    </g>
  </g>
</svg>
