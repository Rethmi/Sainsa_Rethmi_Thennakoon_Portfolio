<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f130b" />
      <stop offset="50%" stop-color="#2d190f" />
      <stop offset="100%" stop-color="#0f0905" />
    </linearGradient>
    <linearGradient id="fdAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="fdShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#fdBg)" />
  <circle cx="680" cy="90" r="140" fill="#f97316" opacity="0.15" filter="blur(50px)" />
  <circle cx="150" cy="420" r="120" fill="#e11d48" opacity="0.12" filter="blur(50px)" />

  <!-- Mobile phone frames side by side -->
  <g transform="translate(140, 40)" filter="url(#fdShadow)">
    <!-- Phone 1: Discovery Screen -->
    <rect width="240" height="420" rx="32" fill="#140d08" stroke="#432213" stroke-width="2.5" />
    <!-- Dynamic island notch -->
    <rect x="75" y="10" width="90" height="18" rx="9" fill="#000000" />
    
    <!-- Phone 1 Content -->
    <g transform="translate(20, 45)">
      <text x="0" y="16" fill="#fed7aa" font-family="Inter, sans-serif" font-size="11">DELIVERING TO</text>
      <text x="0" y="32" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="700">74 Rosewood Ave, Colombo</text>
      
      <!-- Search bar -->
      <rect y="45" width="200" height="32" rx="10" fill="#23150c" stroke="#442213" />
      <text x="12" y="65" fill="#a8a29e" font-family="Inter, sans-serif" font-size="10">Search burgers, sushi, pizza...</text>
      
      <!-- Category pills -->
      <g transform="translate(0, 90)">
        <rect width="58" height="24" rx="8" fill="url(#fdAccent)" />
        <text x="29" y="16" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">All</text>
        <rect x="66" width="60" height="24" rx="8" fill="#23150c" />
        <text x="96" y="16" fill="#fed7aa" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Burgers</text>
        <rect x="134" width="60" height="24" rx="8" fill="#23150c" />
        <text x="164" y="16" fill="#fed7aa" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Pizza</text>
      </g>

      <!-- Featured item -->
      <g transform="translate(0, 130)">
        <rect width="200" height="110" rx="14" fill="#23150c" stroke="#442213" />
        <rect x="10" y="10" width="180" height="60" rx="10" fill="url(#fdAccent)" opacity="0.3" />
        <text x="100" y="45" fill="#ffedd5" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Artisan Angus Burger</text>
        <text x="12" y="88" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Smash Burger Co.</text>
        <text x="12" y="102" fill="#fdba74" font-family="Inter, sans-serif" font-size="10">★ 4.9 · 20-30 mins · $$</text>
      </g>

      <!-- Second item -->
      <g transform="translate(0, 255)">
        <rect width="200" height="90" rx="14" fill="#23150c" stroke="#442213" />
        <text x="12" y="25" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Tokyo Ramen Bowl</text>
        <text x="12" y="40" fill="#fdba74" font-family="Inter, sans-serif" font-size="10">★ 4.8 · Japanese · $14.50</text>
        <rect x="12" y="55" width="176" height="22" rx="6" fill="url(#fdAccent)" />
        <text x="100" y="70" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Quick Add +</text>
      </g>
    </g>

    <!-- Bottom bar -->
    <rect x="15" y="380" width="210" height="28" rx="14" fill="#0c0704" />
    <circle cx="50" cy="394" r="5" fill="#f97316" />
    <circle cx="120" cy="394" r="5" fill="#78716c" />
    <circle cx="190" cy="394" r="5" fill="#78716c" />
  </g>

  <!-- Phone 2: Live Tracking Screen -->
  <g transform="translate(420, 40)" filter="url(#fdShadow)">
    <rect width="240" height="420" rx="32" fill="#140d08" stroke="#432213" stroke-width="2.5" />
    <rect x="75" y="10" width="90" height="18" rx="9" fill="#000000" />

    <g transform="translate(20, 45)">
      <text x="0" y="16" fill="#fed7aa" font-family="Inter, sans-serif" font-size="11">ORDER #QB-8942</text>
      <text x="0" y="34" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="700">On The Way!</text>

      <!-- Simulated Map Card -->
      <g transform="translate(0, 48)">
        <rect width="200" height="150" rx="14" fill="#1f2937" stroke="#374151" />
        <!-- Map roads -->
        <path d="M 20,40 Q 80,60 120,40 T 180,90" stroke="#4b5563" stroke-width="6" fill="none" />
        <path d="M 40,120 L 120,40" stroke="#4b5563" stroke-width="5" fill="none" />
        <path d="M 120,40 L 160,130" stroke="#f97316" stroke-width="4" stroke-dasharray="4 4" fill="none" />
        <!-- Courier Pin -->
        <circle cx="120" cy="40" r="10" fill="#f97316" />
        <circle cx="120" cy="40" r="4" fill="#ffffff" />
        <!-- Destination Pin -->
        <circle cx="160" cy="130" r="12" fill="#22c55e" />
        <circle cx="160" cy="130" r="5" fill="#ffffff" />
      </g>

      <!-- Courier details -->
      <g transform="translate(0, 215)">
        <rect width="200" height="70" rx="12" fill="#23150c" stroke="#442213" />
        <circle cx="35" cy="35" r="18" fill="#f97316" />
        <text x="65" y="28" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Kamal Perera</text>
        <text x="65" y="44" fill="#fdba74" font-family="Inter, sans-serif" font-size="10">Honda CB125 · ★ 4.95</text>
        <text x="65" y="58" fill="#34d399" font-family="Inter, sans-serif" font-size="9" font-weight="600">Arriving in 12 mins</text>
      </g>

      <!-- Action button -->
      <rect y="300" width="200" height="34" rx="10" fill="url(#fdAccent)" />
      <text x="100" y="322" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Call Courier</text>
    </g>

    <rect x="15" y="380" width="210" height="28" rx="14" fill="#0c0704" />
    <circle cx="50" cy="394" r="5" fill="#78716c" />
    <circle cx="120" cy="394" r="5" fill="#f97316" />
    <circle cx="190" cy="394" r="5" fill="#78716c" />
  </g>
</svg>