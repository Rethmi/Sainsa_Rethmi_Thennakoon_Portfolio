<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="hsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="woodCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <filter id="hsDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#hsBg)" />
  <circle cx="150" cy="80" r="130" fill="#f97316" opacity="0.1" filter="blur(50px)" />
  <circle cx="720" cy="400" r="150" fill="#ec4899" opacity="0.1" filter="blur(50px)" />

  <g transform="translate(40, 35)" filter="url(#hsDrop)">
    <rect width="720" height="430" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <rect width="720" height="44" rx="16" fill="#27272a" />
    <path d="M 0,44 L 720,44" stroke="#3f3f46" stroke-width="1" />
    
    <circle cx="25" cy="22" r="5.5" fill="#ef4444" />
    <circle cx="45" cy="22" r="5.5" fill="#eab308" />
    <circle cx="65" cy="22" r="5.5" fill="#22c55e" />

    <rect x="180" y="10" width="360" height="24" rx="6" fill="#18181b" stroke="#3f3f46" />
    <text x="360" y="26" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">handspire.market/curated-ceramics</text>

    <!-- Top Navigation inside Mockup -->
    <rect x="25" y="65" width="28" height="28" rx="8" fill="url(#hsAccent)" />
    <text x="64" y="84" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="bold">HandSpire</text>
    <text x="148" y="84" fill="#f97316" font-family="Inter, sans-serif" font-size="11" font-weight="600">COLLECTIVE</text>
    
    <text x="410" y="82" fill="#d4d4d8" font-family="Inter, sans-serif" font-size="12">Explore Crafts</text>
    <text x="500" y="82" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12">Artisans</text>
    <rect x="580" y="66" width="115" height="30" rx="15" fill="url(#hsAccent)" />
    <text x="637" y="85" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Become Seller</text>

    <!-- Banner -->
    <rect x="25" y="110" width="670" height="85" rx="14" fill="#27272a" stroke="#3f3f46" />
    <text x="45" y="142" fill="#ffffff" font-family="Inter, sans-serif" font-size="17" font-weight="bold">Authentic Handcrafted Treasures</text>
    <text x="45" y="165" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12">Direct from verified traditional artisans &amp; modern creators across Sri Lanka.</text>

    <!-- Category Pills -->
    <rect x="450" y="132" width="64" height="24" rx="12" fill="#3f3f46" />
    <text x="482" y="148" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Pottery</text>
    <rect x="522" y="132" width="70" height="24" rx="12" fill="#f97316" />
    <text x="557" y="148" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Handwoven</text>
    <rect x="600" y="132" width="75" height="24" rx="12" fill="#3f3f46" />
    <text x="637" y="148" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Woodwork</text>

    <!-- Product Cards -->
    <!-- Card 1 -->
    <g transform="translate(25, 210)">
      <rect width="210" height="195" rx="12" fill="url(#woodCard)" stroke="#3f3f46" />
      <rect width="210" height="105" rx="12" fill="#431407" />
      <circle cx="105" cy="52" r="34" fill="#ea580c" opacity="0.4" />
      <rect x="12" y="12" width="60" height="18" rx="9" fill="#18181b" opacity="0.8" />
      <text x="42" y="24" fill="#fb923c" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Eco Glaze</text>

      <text x="14" y="130" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="bold">Rustic Terra Vase</text>
      <text x="14" y="148" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">by Nimali Crafts • Galle</text>
      <text x="14" y="178" fill="#fb923c" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Rs. 4,500</text>
      <rect x="145" y="160" width="52" height="26" rx="6" fill="#f97316" />
      <text x="171" y="177" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">View</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(255, 210)">
      <rect width="210" height="195" rx="12" fill="url(#woodCard)" stroke="#3f3f46" />
      <rect width="210" height="105" rx="12" fill="#701a75" />
      <circle cx="105" cy="52" r="34" fill="#c026d3" opacity="0.4" />
      <rect x="12" y="12" width="60" height="18" rx="9" fill="#18181b" opacity="0.8" />
      <text x="42" y="24" fill="#f472b6" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Silk Blend</text>

      <text x="14" y="130" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="bold">Dumbara Handloom Tapestry</text>
      <text x="14" y="148" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">by Heritage Weavers • Kandy</text>
      <text x="14" y="178" fill="#f472b6" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Rs. 8,200</text>
      <rect x="145" y="160" width="52" height="26" rx="6" fill="#db2777" />
      <text x="171" y="177" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">View</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(485, 210)">
      <rect width="210" height="195" rx="12" fill="url(#woodCard)" stroke="#3f3f46" />
      <rect width="210" height="105" rx="12" fill="#14532d" />
      <circle cx="105" cy="52" r="34" fill="#16a34a" opacity="0.4" />
      <rect x="12" y="12" width="60" height="18" rx="9" fill="#18181b" opacity="0.8" />
      <text x="42" y="24" fill="#4ade80" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Ebony Art</text>

      <text x="14" y="130" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="bold">Carved Elephant Figurine</text>
      <text x="14" y="148" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">by Ruhunu Studios • Galle</text>
      <text x="14" y="178" fill="#4ade80" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Rs. 6,800</text>
      <rect x="145" y="160" width="52" height="26" rx="6" fill="#16a34a" />
      <text x="171" y="177" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">View</text>
    </g>
  </g>
</svg>
