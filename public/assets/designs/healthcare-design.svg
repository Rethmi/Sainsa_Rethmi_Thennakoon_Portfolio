<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f2e" />
      <stop offset="50%" stop-color="#063244" />
      <stop offset="100%" stop-color="#02141e" />
    </linearGradient>
    <linearGradient id="hcAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="hcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#hcBg)" />
  <circle cx="700" cy="90" r="130" fill="#0ea5e9" opacity="0.15" filter="blur(50px)" />
  <circle cx="120" cy="400" r="130" fill="#10b981" opacity="0.12" filter="blur(50px)" />

  <g transform="translate(40, 35)" filter="url(#hcShadow)">
    <rect width="720" height="430" rx="16" fill="#0b1e28" stroke="#1e3a4b" stroke-width="1.5" />
    <rect width="720" height="44" rx="16" fill="#0f2b38" />
    <path d="M 0,44 L 720,44" stroke="#1e3a4b" stroke-width="1" />
    <circle cx="25" cy="22" r="5" fill="#ef4444" />
    <circle cx="43" cy="22" r="5" fill="#eab308" />
    <circle cx="61" cy="22" r="5" fill="#22c55e" />
    <rect x="180" y="10" width="360" height="24" rx="6" fill="#071b24" stroke="#1e3a4b" />
    <text x="360" y="26" fill="#7dd3fc" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">healthcare-platform.med/portal/appointments</text>

    <!-- Sidebar -->
    <rect x="0" y="44" width="70" height="386" fill="#091d26" />
    <circle cx="35" cy="75" r="15" fill="url(#hcAccent)" />
    <rect x="20" y="115" width="30" height="6" rx="3" fill="#38bdf8" opacity="0.7" />
    <rect x="20" y="145" width="30" height="6" rx="3" fill="#64748b" opacity="0.4" />
    <rect x="20" y="175" width="30" height="6" rx="3" fill="#64748b" opacity="0.4" />
    <rect x="20" y="205" width="30" height="6" rx="3" fill="#64748b" opacity="0.4" />

    <!-- Main Content -->
    <g transform="translate(90, 65)">
      <!-- Top banner -->
      <text x="0" y="20" fill="#f0f9ff" font-family="Inter, sans-serif" font-size="18" font-weight="700">Patient Care &amp; Appointments Portal</text>
      <text x="0" y="38" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Active clinical triage queue · Dr. Sarah Jenkins</text>

      <!-- Stat cards -->
      <g transform="translate(0, 55)">
        <rect width="180" height="65" rx="10" fill="#0e2a36" stroke="#1e3a4b" />
        <text x="15" y="25" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">TOTAL APPOINTMENTS</text>
        <text x="15" y="48" fill="#38bdf8" font-family="Inter, sans-serif" font-size="20" font-weight="700">142</text>
        <rect x="135" y="25" width="30" height="18" rx="4" fill="#0369a1" opacity="0.3" />
        <text x="150" y="38" fill="#38bdf8" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">+14%</text>

        <rect x="200" width="180" height="65" rx="10" fill="#0e2a36" stroke="#1e3a4b" />
        <text x="215" y="25" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">PATIENT ADMISSIONS</text>
        <text x="215" y="48" fill="#34d399" font-family="Inter, sans-serif" font-size="20" font-weight="700">38</text>

        <rect x="400" width="200" height="65" rx="10" fill="#0e2a36" stroke="#1e3a4b" />
        <text x="415" y="25" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">CRITICAL CARE BED OCCUPANCY</text>
        <text x="415" y="48" fill="#fbbf24" font-family="Inter, sans-serif" font-size="20" font-weight="700">86%</text>
      </g>

      <!-- Schedule Table Card -->
      <g transform="translate(0, 135)">
        <rect width="600" height="210" rx="12" fill="#0e2a36" stroke="#1e3a4b" />
        <text x="20" y="28" fill="#f0f9ff" font-family="Inter, sans-serif" font-size="13" font-weight="600">Upcoming Consultations</text>
        
        <!-- Table rows -->
        <g transform="translate(20, 45)">
          <rect width="560" height="34" rx="6" fill="#143444" />
          <circle cx="20" cy="17" r="8" fill="#38bdf8" />
          <text x="40" y="21" fill="#f0f9ff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Eleanor Vance</text>
          <text x="200" y="21" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Cardiology Consult</text>
          <text x="360" y="21" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11">10:30 AM</text>
          <rect x="460" y="8" width="80" height="18" rx="9" fill="#10b981" opacity="0.2" />
          <text x="500" y="21" fill="#34d399" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Confirmed</text>
        </g>

        <g transform="translate(20, 90)">
          <rect width="560" height="34" rx="6" fill="#0d2633" />
          <circle cx="20" cy="17" r="8" fill="#a78bfa" />
          <text x="40" y="21" fill="#f0f9ff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Marcus Sterling</text>
          <text x="200" y="21" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Post-Op Checkup</text>
          <text x="360" y="21" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11">11:15 AM</text>
          <rect x="460" y="8" width="80" height="18" rx="9" fill="#f59e0b" opacity="0.2" />
          <text x="500" y="21" fill="#fbbf24" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Pending</text>
        </g>

        <g transform="translate(20, 135)">
          <rect width="560" height="34" rx="6" fill="#143444" />
          <circle cx="20" cy="17" r="8" fill="#f43f5e" />
          <text x="40" y="21" fill="#f0f9ff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Amelia Diaz</text>
          <text x="200" y="21" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Neurology Assessment</text>
          <text x="360" y="21" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11">02:00 PM</text>
          <rect x="460" y="8" width="80" height="18" rx="9" fill="#10b981" opacity="0.2" />
          <text x="500" y="21" fill="#34d399" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Confirmed</text>
        </g>
      </g>
    </g>
  </g>
</svg>