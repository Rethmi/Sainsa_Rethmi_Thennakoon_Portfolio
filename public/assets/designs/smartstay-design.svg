<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)" />
  <circle cx="700" cy="80" r="140" fill="#6366f1" opacity="0.12" filter="blur(40px)" />
  <circle cx="100" cy="420" r="120" fill="#06b6d4" opacity="0.12" filter="blur(40px)" />

  <!-- App Window Container -->
  <g transform="translate(40, 35)" filter="url(#shadow)">
    <!-- Browser Top Bar -->
    <rect width="720" height="430" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect width="720" height="44" rx="16" fill="#1e293b" />
    <path d="M 0,44 L 720,44" stroke="#334155" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="25" cy="22" r="5.5" fill="#ef4444" />
    <circle cx="45" cy="22" r="5.5" fill="#eab308" />
    <circle cx="65" cy="22" r="5.5" fill="#22c55e" />

    <!-- Browser URL Bar -->
    <rect x="180" y="10" width="360" height="24" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="360" y="26" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">smartstay.app/explore/deluxe-suites</text>

    <!-- Header Navigation inside Mockup -->
    <rect x="25" y="65" width="28" height="28" rx="8" fill="url(#primaryGrad)" />
    <text x="62" y="84" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="bold">SmartStay</text>
    
    <text x="440" y="82" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Destinations</text>
    <text x="530" y="82" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Deals</text>
    <rect x="590" y="67" width="105" height="28" rx="14" fill="url(#primaryGrad)" />
    <text x="642" y="85" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Book Now</text>

    <!-- Hero Search Widget -->
    <rect x="25" y="110" width="670" height="74" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    
    <g transform="translate(45, 126)">
      <text x="0" y="14" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600">LOCATION</text>
      <text x="0" y="34" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="500">Galle Coast, Sri Lanka</text>
    </g>
    <line x1="225" y1="125" x2="225" y2="170" stroke="#334155" stroke-width="1" />
    
    <g transform="translate(245, 126)">
      <text x="0" y="14" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600">CHECK-IN / OUT</text>
      <text x="0" y="34" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="500">Oct 12 - Oct 18, 2026</text>
    </g>
    <line x1="430" y1="125" x2="430" y2="170" stroke="#334155" stroke-width="1" />

    <g transform="translate(450, 126)">
      <text x="0" y="14" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600">GUESTS</text>
      <text x="0" y="34" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="500">2 Adults, 1 Suite</text>
    </g>

    <rect x="590" y="123" width="90" height="46" rx="10" fill="#6366f1" />
    <text x="635" y="151" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Search</text>

    <!-- Cards Row -->
    <!-- Card 1 -->
    <g transform="translate(25, 202)">
      <rect width="210" height="205" rx="12" fill="url(#cardGrad)" stroke="#334155" />
      <rect width="210" height="110" rx="12" fill="#312e81" />
      <path d="M 0,90 Q 60,60 120,85 T 210,75 L 210,110 L 0,110 Z" fill="#4338ca" opacity="0.6" />
      <rect x="12" y="12" width="75" height="20" rx="10" fill="#0f172a" opacity="0.8" />
      <text x="49" y="26" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Ocean Suite</text>
      
      <text x="14" y="136" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Azure Breeze Villa</text>
      <text x="14" y="154" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Sea View • King Bed • Wifi</text>
      <text x="14" y="185" fill="#38bdf8" font-family="Inter, sans-serif" font-size="16" font-weight="bold">$185<tspan fill="#64748b" font-size="11" font-weight="normal">/night</tspan></text>
      <rect x="135" y="166" width="62" height="26" rx="6" fill="#6366f1" />
      <text x="166" y="183" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Select</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(255, 202)">
      <rect width="210" height="205" rx="12" fill="url(#cardGrad)" stroke="#334155" />
      <rect width="210" height="110" rx="12" fill="#0e7490" />
      <path d="M 0,85 Q 70,55 130,80 T 210,70 L 210,110 L 0,110 Z" fill="#0891b2" opacity="0.6" />
      <rect x="12" y="12" width="75" height="20" rx="10" fill="#0f172a" opacity="0.8" />
      <text x="49" y="26" fill="#22d3ee" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Luxury Penthouse</text>
      
      <text x="14" y="136" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Galle Lighthouse Bay</text>
      <text x="14" y="154" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Infinity Pool • Balcony</text>
      <text x="14" y="185" fill="#38bdf8" font-family="Inter, sans-serif" font-size="16" font-weight="bold">$240<tspan fill="#64748b" font-size="11" font-weight="normal">/night</tspan></text>
      <rect x="135" y="166" width="62" height="26" rx="6" fill="#06b6d4" />
      <text x="166" y="183" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Select</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(485, 202)">
      <rect width="210" height="205" rx="12" fill="url(#cardGrad)" stroke="#334155" />
      <rect width="210" height="110" rx="12" fill="#475569" />
      <path d="M 0,80 Q 80,60 140,85 T 210,65 L 210,110 L 0,110 Z" fill="#334155" opacity="0.6" />
      <rect x="12" y="12" width="75" height="20" rx="10" fill="#0f172a" opacity="0.8" />
      <text x="49" y="26" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Deluxe Room</text>
      
      <text x="14" y="136" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="bold">Colonial Heritage Rest</text>
      <text x="14" y="154" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Breakfast Included • Spa</text>
      <text x="14" y="185" fill="#38bdf8" font-family="Inter, sans-serif" font-size="16" font-weight="bold">$135<tspan fill="#64748b" font-size="11" font-weight="normal">/night</tspan></text>
      <rect x="135" y="166" width="62" height="26" rx="6" fill="#6366f1" />
      <text x="166" y="183" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Select</text>
    </g>
  </g>
</svg>
