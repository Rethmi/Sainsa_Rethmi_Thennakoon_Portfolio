<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="stkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#stkBg)" />
  <circle cx="280" cy="180" r="180" fill="#10b981" opacity="0.08" filter="blur(60px)" />
  <circle cx="580" cy="320" r="160" fill="#8b5cf6" opacity="0.08" filter="blur(60px)" />

  <!-- Left: Main Mobile Frame -->
  <g transform="translate(140, 40)" filter="url(#phoneShadow)">
    <!-- Device Body -->
    <rect width="240" height="420" rx="36" fill="#0f172a" stroke="#334155" stroke-width="2.5" />
    
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="80" y="12" width="80" height="18" rx="9" fill="#020617" />
    <circle cx="145" cy="21" r="3" fill="#1e293b" />

    <!-- Status Bar -->
    <text x="24" y="25" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="10" font-weight="600">9:41</text>
    <text x="210" y="25" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="9" text-anchor="end">100%</text>

    <!-- App Header -->
    <text x="24" y="62" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600">THURSDAY, OCT 15</text>
    <text x="24" y="84" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="bold">Streakify</text>
    
    <rect x="180" y="66" width="36" height="24" rx="12" fill="#10b981" opacity="0.15" />
    <text x="198" y="82" fill="#34d399" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🔥 14</text>

    <!-- Circular Progress Widget -->
    <rect x="20" y="100" width="200" height="95" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
    
    <!-- Radial Ring -->
    <circle cx="65" cy="147" r="32" fill="none" stroke="#334155" stroke-width="6" />
    <circle cx="65" cy="147" r="32" fill="none" stroke="url(#neonGreen)" stroke-width="6" stroke-dasharray="160 200" stroke-linecap="round" transform="rotate(-90 65 147)" />
    <text x="65" y="151" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">80%</text>
    
    <text x="115" y="138" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="bold">Daily Target</text>
    <text x="115" y="156" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">4 of 5 Completed</text>
    <text x="115" y="172" fill="#10b981" font-family="Inter, sans-serif" font-size="9" font-weight="600">Keep it up! ⚡</text>

    <!-- Habit Items -->
    <!-- Item 1 -->
    <g transform="translate(20, 206)">
      <rect width="200" height="42" rx="12" fill="#1e293b" />
      <circle cx="24" cy="21" r="10" fill="#10b981" />
      <path d="M 19,21 L 22,24 L 29,17" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="44" y="24" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="500">Read 20 mins</text>
      <text x="180" y="25" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9" text-anchor="end">21d streak</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(20, 256)">
      <rect width="200" height="42" rx="12" fill="#1e293b" />
      <circle cx="24" cy="21" r="10" fill="#10b981" />
      <path d="M 19,21 L 22,24 L 29,17" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="44" y="24" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="500">Design in Figma</text>
      <text x="180" y="25" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9" text-anchor="end">14d streak</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(20, 306)">
      <rect width="200" height="42" rx="12" fill="#1e293b" />
      <circle cx="24" cy="21" r="10" fill="#10b981" />
      <path d="M 19,21 L 22,24 L 29,17" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="44" y="24" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="500">LeetCode / Algo</text>
      <text x="180" y="25" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9" text-anchor="end">8d streak</text>
    </g>

    <!-- Item 4 (Pending) -->
    <g transform="translate(20, 356)">
      <rect width="200" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-dasharray="3 3" />
      <circle cx="24" cy="21" r="9" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="44" y="24" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11" font-weight="500">Evening Meditation</text>
      <text x="180" y="25" fill="#f59e0b" font-family="Inter, sans-serif" font-size="9" text-anchor="end">Pending</text>
    </g>
  </g>

  <!-- Right: Insights & Analytics Phone Frame -->
  <g transform="translate(430, 60)" filter="url(#phoneShadow)">
    <rect width="230" height="390" rx="34" fill="#0f172a" stroke="#334155" stroke-width="2.5" />
    <rect x="75" y="10" width="80" height="16" rx="8" fill="#020617" />
    
    <!-- Top Bar -->
    <text x="24" y="52" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600">WEEKLY ANALYTICS</text>
    <text x="24" y="74" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="bold">Progress Matrix</text>

    <!-- Bar Chart Visual -->
    <rect x="18" y="90" width="194" height="120" rx="14" fill="#1e293b" />
    
    <!-- Chart Bars -->
    <rect x="34" y="165" width="16" height="30" rx="4" fill="#334155" />
    <text x="42" y="202" fill="#64748b" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">M</text>

    <rect x="60" y="145" width="16" height="50" rx="4" fill="#06b6d4" />
    <text x="68" y="202" fill="#64748b" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">T</text>

    <rect x="86" y="130" width="16" height="65" rx="4" fill="#10b981" />
    <text x="94" y="202" fill="#64748b" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">W</text>

    <rect x="112" y="120" width="16" height="75" rx="4" fill="url(#neonGreen)" />
    <text x="120" y="202" fill="#34d399" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">T</text>

    <rect x="138" y="150" width="16" height="45" rx="4" fill="#06b6d4" />
    <text x="146" y="202" fill="#64748b" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">F</text>

    <rect x="164" y="160" width="16" height="35" rx="4" fill="#334155" />
    <text x="172" y="202" fill="#64748b" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">S</text>

    <!-- Achievement Badge -->
    <rect x="18" y="224" width="194" height="65" rx="14" fill="url(#neonPurple)" opacity="0.9" />
    <circle cx="48" cy="256" r="18" fill="#ffffff" opacity="0.2" />
    <text x="48" y="261" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🏆</text>
    <text x="76" y="249" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Unstoppable Streak</text>
    <text x="76" y="267" fill="#f3e8ff" font-family="Inter, sans-serif" font-size="10">Achieved 14 days consecutive logs!</text>

    <!-- Bottom Nav Mockup -->
    <rect x="18" y="305" width="194" height="45" rx="14" fill="#1e293b" />
    <circle cx="50" cy="327" r="10" fill="#10b981" opacity="0.2" />
    <circle cx="115" cy="327" r="14" fill="url(#neonGreen)" />
    <text x="115" y="332" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">+</text>
    <circle cx="180" cy="327" r="10" fill="#334155" />
  </g>
</svg>
