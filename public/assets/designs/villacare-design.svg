<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#14213d" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="vcGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="vcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#vcBg)" />
  <circle cx="700" cy="90" r="140" fill="#f59e0b" opacity="0.12" filter="blur(50px)" />
  <circle cx="120" cy="400" r="130" fill="#38bdf8" opacity="0.1" filter="blur(50px)" />

  <g transform="translate(40, 35)" filter="url(#vcShadow)">
    <rect width="720" height="430" rx="16" fill="#0d1527" stroke="#1f2d4d" stroke-width="1.5" />
    <rect width="720" height="44" rx="16" fill="#141f38" />
    <path d="M 0,44 L 720,44" stroke="#1f2d4d" stroke-width="1" />
    <circle cx="25" cy="22" r="5" fill="#ef4444" />
    <circle cx="43" cy="22" r="5" fill="#eab308" />
