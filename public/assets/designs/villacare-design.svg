            <text x="10" y="35" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Villa Galle Palm · Assigned: Maintenance Crew A</text>
            <rect x="220" y="12" width="60" height="20" rx="4" fill="#f59e0b" opacity="0.2" />
            <text x="250" y="26" fill="#fbbf24" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">In Progress</text>
