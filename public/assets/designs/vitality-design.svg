<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04121e" />
      <stop offset="50%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="riskHigh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="vitCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="vitShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#vitBg)" />
  <circle cx="200" cy="100" r="150" fill="#0284c7" opacity="0.12" filter="blur(60px)" />
  <circle cx="680" cy="400" r="140" fill="#06b6d4" opacity="0.1" filter="blur(60px)" />

  <g transform="translate(40, 35)" filter="url(#vitShadow)">
    <rect width="720" height="430" rx="16" fill="#0b1727" stroke="#1e293b" stroke-width="1.5" />
    <rect width="720" height="44" rx="16" fill="#0f2238" />
    <path d="M 0,44 L 720,44" stroke="#1e3a5f" stroke-width="1" />
    
    <circle cx="25" cy="22" r="5.5" fill="#ef4444" />
    <circle cx="45" cy="22" r="5.5" fill="#eab308" />
    <circle cx="65" cy="22" r="5.5" fill="#22c55e" />

    <rect x="180" y="10" width="360" height="24" rx="6" fill="#0b1727" stroke="#1e3a5f" />
    <text x="360" y="26" fill="#7dd3fc" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">vitality-health.net/clinical/triage-stratification</text>

    <!-- App Bar -->
    <rect x="25" y="65" width="28" height="28" rx="8" fill="url(#vitCyan)" />
    <path d="M 39,72 L 39,86 M 32,79 L 46,79" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <text x="64" y="84" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="bold">Vitality Health</text>
    <text x="175" y="84" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="600">ANALYTICS SUITE</text>

    <!-- Top KPI Cards -->
    <g transform="translate(25, 110)">
      <rect width="155" height="70" rx="12" fill="#0f2238" stroke="#1e3a5f" />
      <text x="15" y="26" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600">TOTAL MONITORED</text>
      <text x="15" y="52" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="bold">1,428</text>
      <text x="105" y="52" fill="#22c55e" font-family="Inter, sans-serif" font-size="10" font-weight="600">+12%</text>
    </g>

    <g transform="translate(195, 110)">
      <rect width="155" height="70" rx="12" fill="#0f2238" stroke="#ef4444" stroke-opacity="0.4" />
      <text x="15" y="26" fill="#fca5a5" font-family="Inter, sans-serif" font-size="10" font-weight="600">CRITICAL / HIGH VCI</text>
      <text x="15" y="52" fill="#ef4444" font-family="Inter, sans-serif" font-size="20" font-weight="bold">84</text>
      <text x="100" y="52" fill="#f87171" font-family="Inter, sans-serif" font-size="10" font-weight="600">Urgent</text>
    </g>

    <g transform="translate(365, 110)">
      <rect width="155" height="70" rx="12" fill="#0f2238" stroke="#1e3a5f" />
      <text x="15" y="26" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600">AVG TRIAGE TIME</text>
      <text x="15" y="52" fill="#38bdf8" font-family="Inter, sans-serif" font-size="20" font-weight="bold">4.2 min</text>
      <text x="105" y="52" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="600">-35%</text>
    </g>

    <g transform="translate(535, 110)">
      <rect width="160" height="70" rx="12" fill="#0f2238" stroke="#1e3a5f" />
      <text x="15" y="26" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600">MODEL ACCURACY</text>
      <text x="15" y="52" fill="#10b981" font-family="Inter, sans-serif" font-size="20" font-weight="bold">96.8%</text>
      <text x="110" y="52" fill="#34d399" font-family="Inter, sans-serif" font-size="10" font-weight="600">AUC</text>
    </g>

    <!-- Main Chart & Patient Table Split -->
    <g transform="translate(25, 195)">
      <!-- Left Chart -->
      <rect width="325" height="210" rx="14" fill="#0f2238" stroke="#1e3a5f" />
      <text x="20" y="28" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="bold">Vitality Risk Distribution Curve</text>
      
      <!-- Wave curve -->
      <path d="M 25,170 Q 75,170 110,130 T 190,75 T 260,110 T 310,165" fill="none" stroke="url(#vitCyan)" stroke-width="3" />
      <path d="M 25,170 Q 75,170 110,130 T 190,75 T 260,110 T 310,165 L 310,185 L 25,185 Z" fill="url(#vitCyan)" opacity="0.12" />
      <circle cx="190" cy="75" r="5" fill="#38bdf8" />
      <text x="190" y="60" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Peak VCI: 88.4</text>
      
      <line x1="25" y1="185" x2="310" y2="185" stroke="#1e3a5f" stroke-width="1" />
      <text x="35" y="200" fill="#64748b" font-family="Inter, sans-serif" font-size="9">Low (0-30)</text>
      <text x="150" y="200" fill="#64748b" font-family="Inter, sans-serif" font-size="9">Medium (31-70)</text>
      <text x="260" y="200" fill="#ef4444" font-family="Inter, sans-serif" font-size="9" font-weight="600">High (71+)</text>
    </g>

    <!-- Right Table -->
    <g transform="translate(365, 195)">
      <rect width="330" height="210" rx="14" fill="#0f2238" stroke="#1e3a5f" />
      <text x="20" y="28" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="bold">Active Patient Triage Queue</text>

      <!-- Row 1 -->
      <rect x="15" y="45" width="300" height="44" rx="8" fill="#0b1727" />
      <circle cx="35" cy="67" r="12" fill="#ef4444" opacity="0.2" />
      <text x="35" y="71" fill="#ef4444" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">!92</text>
      <text x="58" y="63" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Patient #48291</text>
      <text x="58" y="78" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Cardiac Arrhythmia • ICU-1</text>
      <rect x="235" y="57" width="70" height="20" rx="10" fill="#ef4444" />
      <text x="270" y="71" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">HIGH RISK</text>

      <!-- Row 2 -->
      <rect x="15" y="98" width="300" height="44" rx="8" fill="#0b1727" />
      <circle cx="35" cy="120" r="12" fill="#f59e0b" opacity="0.2" />
      <text x="35" y="124" fill="#f59e0b" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">64</text>
      <text x="58" y="116" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Patient #50122</text>
      <text x="58" y="131" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Respiratory Syncytial • Ward B</text>
      <rect x="235" y="110" width="70" height="20" rx="10" fill="#f59e0b" />
      <text x="270" y="124" fill="#0f172a" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ELEVATED</text>

      <!-- Row 3 -->
      <rect x="15" y="151" width="300" height="44" rx="8" fill="#0b1727" />
      <circle cx="35" cy="173" r="12" fill="#10b981" opacity="0.2" />
      <text x="35" y="177" fill="#10b981" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">24</text>
      <text x="58" y="169" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Patient #51304</text>
      <text x="58" y="184" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Post-Op Recovery • Stable</text>
      <rect x="235" y="163" width="70" height="20" rx="10" fill="#10b981" />
      <text x="270" y="177" fill="#ffffff" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">STABLE</text>
    </g>
  </g>
</svg>
